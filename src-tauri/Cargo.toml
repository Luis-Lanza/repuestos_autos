[package]
name = "repuestos-autos"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "repuestos-autos"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "test"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
serde_json = "1"
