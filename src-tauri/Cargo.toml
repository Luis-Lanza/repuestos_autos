[package]
name = "repuestos-autos"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop = ["dep:tauri"]

[dependencies]
tauri = { version = "2", default-features = false, optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
